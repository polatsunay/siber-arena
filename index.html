<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siber Arena</title>
<meta name="description" content="Dijital güvenlik bilgi yarışması: takımlar telefondan yarışır, skor tahtada canlı.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#1b1446;--bg2:#2a1f6b;--card:#fff;--ink:#1d1b33;--mut:#9b95c9;--y:#ffd23f;--c0:#e8384f;--c1:#2f7de1;--c2:#e9a21b;--c3:#22a565;--ok:#3ddc97}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 700px at 20% -10%,#4b2fb8 0,transparent 60%),radial-gradient(900px 600px at 110% 110%,#c2185b55 0,transparent 60%),var(--bg);color:#fff;font-family:Nunito,system-ui,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
button:disabled{opacity:.45;cursor:not-allowed}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;margin:.2em 0}
#app{min-height:100vh;padding:24px 16px;max-width:1280px;margin:0 auto}
.muted{color:var(--mut)}
.lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 0 6px;font-weight:800}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:2px solid #4a3f99;background:#120d33;color:#fff;font:inherit;font-size:1rem}
.inp:focus{outline:none;border-color:var(--y)}
select.inp{appearance:auto}
.go{display:block;width:100%;margin-top:22px;padding:16px;border-radius:16px;background:var(--y);color:#2a1f00;font-family:Fredoka;font-size:1.3rem;font-weight:700;box-shadow:0 6px 0 #b8901c;transition:transform .1s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #b8901c}
.go.sm{display:inline-block;width:auto;font-size:1rem;padding:10px 18px;margin:0}
.sm{padding:9px 14px;border-radius:10px;background:#3a2f86;color:#fff;font-weight:700}
.sm:hover{background:#4a3fa6}
.sm.danger{background:#7a1f35}
.back{background:none;color:var(--mut);padding:6px 0;font-weight:700}
.err{background:#5c1530;border:1px solid #e8384f;padding:10px 14px;border-radius:12px;margin:10px 0}
.okc{background:#123d2e;border:1px solid var(--ok);padding:10px 14px;border-radius:12px;margin:10px 0}
.wait{color:var(--y);margin:10px 0}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
/* home */
.home{display:flex;flex-direction:column;align-items:center;justify-content:center}
.hero{text-align:center;margin:3vh 0 28px}
.logo{font-size:64px;filter:drop-shadow(0 8px 20px #000a);animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hero h1{font-size:clamp(2.6rem,8vw,5rem);letter-spacing:.02em;line-height:1}
.hero h1 span{color:var(--y)}
.hero p{max-width:560px;margin:10px auto;color:#cfcaf2}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;width:100%;max-width:960px}
.big{border-radius:22px;padding:26px 18px;color:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 0 #0005;transition:transform .15s}
.big:hover{transform:translateY(-4px)}
.big span{font-size:40px}.big b{font-family:Fredoka;font-size:1.5rem}.big small{opacity:.85}
.b1{background:linear-gradient(135deg,#e8384f,#b0174a)}.b2{background:linear-gradient(135deg,#2f7de1,#1b4fb0)}.b3{background:linear-gradient(135deg,#22a565,#127547)}
.foot{margin-top:30px;color:var(--mut);font-size:.9rem;text-align:center}.foot a{color:var(--y)}
/* panels */
.panel{max-width:860px;margin:0 auto;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:24px;padding:22px 24px 26px}
.panel.narrow{max-width:460px}.panel.wide{max-width:1180px}
.lvls{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.lvls button,.modes button{background:#120d33;border:2px solid #3a2f86;border-radius:16px;color:#fff;padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.lvls button span{font-size:28px}.lvls button b{font-family:Fredoka;font-size:1.1rem}.lvls button small,.modes small{color:var(--mut);font-size:.8rem}
.lvls button.on,.modes button.on{border-color:var(--y);background:#2f2470;box-shadow:0 0 0 3px #ffd23f33}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:auto auto 1fr;gap:20px;align-items:end}
.chips{display:flex;gap:6px}.chips button{min-width:52px;padding:11px 12px;border-radius:12px;background:#120d33;border:2px solid #3a2f86;color:#fff;font-weight:800}
.chips button.on{border-color:var(--y);background:#2f2470}
/* lobby */
.lob{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:28px;align-items:start}
.lob-l{background:#fff;color:var(--ink);border-radius:24px;padding:22px;text-align:center}
.lob-l .lbl{color:#6b6597}
.lob-l .okc{background:#e3f8ee;color:#0d5c3a}.lob-l .err{background:#fde7ec;color:#7a1f35}.lob-l .wait{color:#8a6a00}
.url{font-weight:800;font-size:1.1rem;word-break:break-all}
.code{font-family:Fredoka;font-size:4.2rem;letter-spacing:.12em;color:#2a1f6b;line-height:1.1}
.qr{display:flex;justify-content:center;margin:14px 0}.qr img,.qr canvas{border-radius:8px}
.lob-r h2{font-size:1.8rem}
.teams{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 10px;min-height:60px}
.tm{background:#ffffff1a;border-radius:999px;padding:10px 16px;font-weight:800;font-size:1.1rem;animation:pop .35s ease}
.tm .x{background:none;color:#ff9db0;margin-left:4px}
@keyframes pop{0%{transform:scale(.4);opacity:0}80%{transform:scale(1.08)}}
.addt{display:flex;gap:8px;margin-top:10px}
/* game */
.qhead{display:flex;justify-content:space-between;gap:12px;font-weight:800;flex-wrap:wrap}
.qno{background:var(--y);color:#2a1f00;padding:6px 14px;border-radius:999px}
.code-s{color:var(--mut)}
.tbar{height:10px;background:#ffffff1a;border-radius:999px;margin:12px 0 18px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--ok),var(--y),var(--c0));transition:width .25s linear}
.qbody{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:28px;align-items:start}
.qside{min-width:0}
.qq{font-size:clamp(1.4rem,2.6vw,2.1rem);margin-bottom:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{position:relative;border-radius:16px;padding:18px 18px 18px 58px;font-weight:800;font-size:1.15rem;min-height:84px;display:flex;align-items:center;box-shadow:0 5px 0 #0004;transition:opacity .3s,transform .3s}
.opt .sh,.cop .sh{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:1.5rem;opacity:.9}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}
.opt.dim{opacity:.28}.opt.right{transform:scale(1.03);box-shadow:0 0 0 4px #fff,0 5px 0 #0004}
.opt .cnt{position:absolute;right:14px;top:10px;background:#0005;border-radius:999px;padding:2px 10px;font-size:.95rem}
.hctl{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:16px}
.tleft{font-family:Fredoka;font-size:2.4rem;color:var(--y);min-width:60px;text-align:right}
.expl{background:#fff;color:var(--ink);border-radius:16px;padding:14px 18px;margin-top:16px;animation:pop .4s}
.expl p{margin:6px 0 0}
.bars{display:flex;gap:14px;height:90px;align-items:flex-end;margin-top:14px}
.barw{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.barw i{display:block;width:100%;border-radius:8px 8px 0 0;min-height:4px;transition:height .6s}
.barw span{font-size:.9rem;margin-top:2px}
.tekmarks{margin-top:16px;background:#ffffff0d;border-radius:16px;padding:10px 12px;display:grid;gap:6px}
.tkr{display:flex;align-items:center;gap:6px}.tkr span{flex:1;font-weight:800}
.tkr button{width:44px;height:38px;border-radius:10px;color:#fff;font-size:1.1rem;opacity:.55}
.tkr button.pick{opacity:1;box-shadow:0 0 0 3px #fff}
/* cards */
.qcard{display:flex;justify-content:center}
.phone{width:100%;max-width:360px;background:#f4f2fb;color:var(--ink);border-radius:30px;border:8px solid #0d0a24;overflow:hidden;box-shadow:0 20px 40px #0006}
.ph-top{background:#0d0a24;color:#fff;font-size:.8rem;padding:4px 14px 8px;text-align:center}
.ph-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid #e3e0f0}
.ph-av{width:34px;height:34px;border-radius:50%;background:#e3e0f0;display:grid;place-items:center}
.p-wa .ph-head{background:#075e54;color:#fff}.p-wa .ph-body{background:#ece5dd}
.p-dm .ph-head{background:linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045);color:#fff}
.ph-body{padding:16px 14px 22px;min-height:150px}
.bub{background:#fff;border-radius:4px 16px 16px 16px;padding:12px 14px;line-height:1.45;box-shadow:0 1px 2px #0002;max-width:92%}
.p-sms .bub{background:#e5e5ea}
.lnk{color:#1b5fd1;word-break:break-all}
.mailc,.webc,.callc,.durc{width:100%;max-width:420px;background:#fff;color:var(--ink);border-radius:18px;overflow:hidden;box-shadow:0 20px 40px #0006}
.mc-top{background:#c5221f;color:#fff;padding:8px 14px;font-weight:800;font-size:.9rem}
.mc-from{padding:12px 16px;border-bottom:1px solid #eee}.mc-from code{color:#b0174a;font-size:.85rem;word-break:break-all}
.mc-body{padding:14px 16px;line-height:1.5}
.mc-btn{margin-top:12px;background:#1a73e8;color:#fff;border-radius:8px;padding:10px;font-size:.9rem;word-break:break-all}
.wc-bar{background:#dee1e6;padding:8px 10px;display:flex;gap:8px;align-items:center;font-size:.85rem}
.wc-url{background:#fff;border-radius:999px;padding:5px 12px;flex:1;word-break:break-all}
.unsafe{color:#c5221f;font-weight:800}.safe{color:#188038}
.wc-body{padding:18px}
.callc{background:linear-gradient(180deg,#2c2c54,#0d0a24);color:#fff;text-align:center;padding:24px 18px}
.cc-av{font-size:44px}.callc b{display:block;font-size:1.3rem}.callc small{color:#bbb}
.cc-say{background:#ffffff1a;border-radius:14px;padding:12px;margin:14px 0;line-height:1.45;font-style:italic}
.cc-btns{display:flex;justify-content:space-around;font-size:28px}
.durc{padding:18px 20px;line-height:1.5}.dc-tag{display:inline-block;background:#ffd23f;color:#2a1f00;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.85rem}
/* board */
.boardv,.finale{text-align:center}
.boardv h2{font-size:2.2rem;margin-bottom:18px}
.lb{max-width:760px;margin:0 auto;display:grid;gap:10px}
.lbr{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:16px;padding:12px 18px;font-size:1.2rem;animation:slide .45s both}
.lbr:nth-child(1){background:var(--y)}
@keyframes slide{from{transform:translateX(-40px);opacity:0}}
.lbr .pos{font-family:Fredoka;font-size:1.5rem;width:34px}.lbr .av{font-size:1.6rem}.lbr b{flex:1;text-align:left}
.lbr .gain{color:#127547;font-weight:800}.lbr .sc{font-family:Fredoka;font-size:1.4rem;min-width:70px;text-align:right}
.fire{font-weight:800}
.boardv .go,.fbtns .go{display:inline-block;width:auto;padding:14px 36px}
.fbtns{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:22px}.fbtns .go{margin:0}
.finale h1{font-size:3rem}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:26px 0}
.pd{width:200px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pd .pav{font-size:54px;animation:bob 2s infinite}.pd b{font-family:Fredoka;font-size:1.3rem}
.pst{width:100%;border-radius:14px 14px 0 0;font-family:Fredoka;font-size:3rem;display:grid;place-items:center;margin-top:6px}
.p1 .pst{height:170px;background:var(--y);color:#2a1f00}.p2 .pst{height:120px;background:#cfd6e6;color:#333}.p3 .pst{height:90px;background:#e0975a;color:#3a1d00}
.lb.small .lbr{font-size:1rem;padding:8px 14px}
.conf{position:fixed;inset:0;pointer-events:none;z-index:50}
/* client */
.client{max-width:520px}
.chead{display:flex;justify-content:space-between;background:#ffffff14;border-radius:14px;padding:10px 14px;font-weight:800}
.cq{margin:14px 0}.cq h3{font-size:1.35rem}
.cops{display:grid;gap:10px}
.cop{position:relative;color:#fff;border-radius:16px;padding:18px 16px 18px 56px;font-weight:800;font-size:1.1rem;text-align:left;min-height:74px;box-shadow:0 5px 0 #0004}
.cop:disabled{opacity:.35}.cop.pick{opacity:1;box-shadow:0 0 0 4px #fff}
.cwait,.cres{text-align:center;padding:36px 10px}
.big-ic{font-size:72px}
.cres.ok h2{color:var(--ok)}.cres.no h2{color:#ff8fa3}
.cres .gain{font-family:Fredoka;font-size:2.6rem;color:var(--y)}
.cres .ex{background:#ffffff14;border-radius:14px;padding:12px;text-align:left}
.codein{font-family:Fredoka;font-size:2rem;letter-spacing:.2em;text-align:center;text-transform:uppercase}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.avs button{font-size:1.6rem;padding:8px 0;border-radius:12px;background:#120d33;border:2px solid #3a2f86}.avs button.on{border-color:var(--y);background:#2f2470}
/* editor */
.setl{display:grid;gap:8px;margin:12px 0}.setr{display:flex;gap:10px;align-items:center;background:#120d33;border-radius:12px;padding:10px 14px}.setr b{flex:1}
.edgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:10px}
.oprow{display:flex;gap:8px;align-items:center;margin-bottom:6px}.oprow .sh{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}.oprow label{white-space:nowrap;font-size:.85rem;color:var(--mut)}
.qlist{display:grid;gap:6px}.ql{display:flex;gap:8px;align-items:center;background:#120d33;border-radius:10px;padding:8px 10px}.ql span{flex:1;font-size:.9rem}
/* certificates */
#certs{display:none}
@media print{
 @page{size:A4 landscape;margin:0}
 body.printing{background:#fff}
 body.printing #app,body.printing .conf{display:none}
 body.printing #certs{display:block}
 .cert{width:297mm;height:210mm;padding:12mm;page-break-after:always;color:#1d1b33;font-family:Nunito,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .cbd{height:100%;border:3mm solid #2a1f6b;outline:1mm solid #ffd23f;outline-offset:-6mm;border-radius:6mm;text-align:center;padding:14mm 20mm;position:relative;background:linear-gradient(135deg,#fffdf2,#f3f0ff)}
 .cseal{font-size:56px}.ctop{letter-spacing:.2em;font-weight:800;color:#6b6597;font-size:12pt}
 .cert h1{font-family:Fredoka;font-size:40pt;color:#2a1f6b;margin:4mm 0}
 .cert h2{font-family:Fredoka;font-size:30pt;margin:2mm 0;color:#b0174a}
 .cfor{margin:0;font-size:13pt}.ctext{font-size:14pt;max-width:200mm;margin:4mm auto}
 .cskills{color:#6b6597;font-size:11pt}
 .csign{display:flex;justify-content:space-around;margin-top:10mm}.csign div{display:flex;flex-direction:column;border-top:.5mm solid #2a1f6b;padding-top:2mm;min-width:70mm}.csign span{font-weight:800;font-size:13pt;min-height:6mm}.csign small{color:#6b6597}
}
@media (max-width:860px){
 .menu,.modes,.lob,.qbody,.edgrid{grid-template-columns:1fr}
 .row3{grid-template-columns:1fr}.panel{padding:18px 14px}
 .opts{grid-template-columns:1fr}.code{font-size:3.2rem}.pd{width:110px}.pd b{font-size:1rem}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="certs"></div>
<script>
/* Soru bankası
 kart türleri: sms, wa, dm, mail, web, call, durum
 her soru: {k:kart türü, f:gönderen/başlık, a:adres/numara, m:mesaj (HTML değil, düz metin; **kalın**), u:bağlantı,
            q:soru, o:[seçenekler], c:doğru indeks, e:açıklama} */
var BANK={
 ilk:{name:'5–6. sınıf',ic:'🧒',d:'Oyun hesapları, şifreler, tanımadığın kişiler',qs:[
  {k:'dm',f:'@oyun_hediye_merkezi',m:'Tebrikler!! 🎉 Bedava 5000 elmas kazandın. Almak için kullanıcı adını ve **şifreni** yaz 👇',q:'Bu mesaja ne yaparsın?',o:['Şifremi yazarım, elmas bedava!','Yanıt vermem, hesabı engeller ve bir yetişkine söylerim','Sadece kullanıcı adımı yazarım'],c:1,e:'Hiçbir oyun şifreni mesajla istemez. “Bedava elmas” hesap çalmanın en bilinen yoludur.'},
  {k:'durum',f:'Şifre seçimi',m:'Yeni oyun hesabın için şifre belirliyorsun.',q:'Hangisi en güçlü şifre?',o:['ali2014','123456','Mavi-Kedi7Uçtu!','benimşifrem'],c:2,e:'Uzun, harf + rakam + sembol içeren ve adını ya da doğum yılını içermeyen şifreler güçlüdür.'},
  {k:'wa',f:'+90 541 222 33 44',m:'Selam! Ben senin okuldan bir arkadaşınım 😊 Ev adresini atar mısın, sana hediye göndereceğim',q:'Ne yaparsın?',o:['Adresimi gönderirim','Kim olduğunu sorar, sonra gönderirim','Tanımadığım biri; adres vermem, aileme gösteririm'],c:2,e:'Tanımadığın birine adres, okul ya da telefon gibi bilgiler verilmez. Ailene göster.'},
  {k:'durum',f:'Arkadaşın istiyor',m:'En yakın arkadaşın: “Şifreni söyler misin, senin hesabından oynayacağım.”',q:'Ne yaparsın?',o:['Söylerim, o benim en iyi arkadaşım','Söylemem; şifre sadece bana ve aileme özeldir','Yarısını söylerim'],c:1,e:'Şifre en yakın arkadaşla bile paylaşılmaz. Arkadaşlıklar değişebilir, hesabın senin kalmalı.'},
  {k:'web',f:'Bedava Oyun İndir!!!',a:'http://bedava-oyun-indir-hemen.xyz',m:'🎮 Ücretli oyunu BEDAVA indir! Sadece “İzin ver”e bas ve kurulumu başlat.',q:'Bu siteden oyun indirmek güvenli mi?',o:['Evet, bedava fırsat','Hayır; oyunları sadece resmî mağazadan indiririm','Antivirüs varsa sorun olmaz'],c:1,e:'“Güvenli değil” uyarısı ve garip adres tehlike işaretidir. Uygulamalar yalnızca resmî mağazadan indirilir.'},
  {k:'dm',f:'@komik_videolar_tr',m:'Sınıfından birinin utanç verici videosu var bende 😂 Görmek ister misin? Herkese gönder!',q:'Ne yaparsın?',o:['Bakarım ve arkadaşlarıma gönderirim','Bakmam, paylaşmam ve bir öğretmene ya da aileme söylerim','Sadece bakarım, kimseye göndermem'],c:1,e:'Başkasını utandıran içerikleri paylaşmak siber zorbalıktır. Yayma, bir yetişkine söyle.'},

 peer.on('error',function(e){onFail(e&&e.type==='unavailable-id'?'Bu oda kodu kullanımda.':'Bağlantı kurulamadı ('+(e&&e.type||'hata')+').')});
 peer.on('connection',function(c){
  c.on('data',function(d){if(d&&d.from){self.conns[d.from]=c;onMsg(d.from,d.d)}});
 });
 self.send=function(to,d){var c=self.conns[to];if(c&&c.open)try{c.send({d:d})}catch(e){}};
 self.peer=peer;
}
function ClientNet(code,me,onMsg,onOpen,onFail){
 var self=this;
 if(LOCAL){
  var bc=new BroadcastChannel(PFX+code);
  bc.onmessage=function(e){var m=e.data;if(m.to!==me)return;onMsg(m.d)};
  self.send=function(d){bc.postMessage({to:'host',from:me,d:d})};
  setTimeout(onOpen,50);return;
 }
 if(!window.Peer){onFail('Bağlantı kütüphanesi yüklenemedi.');return}
 var peer=new Peer({debug:0}),conn=null,opened=false;
 peer.on('open',function(){
  conn=peer.connect(PFX+code,{reliable:true});
  conn.on('open',function(){opened=true;onOpen()});
  conn.on('data',function(d){onMsg(d.d)});
  conn.on('close',function(){onFail('Öğretmen ekranıyla bağlantı koptu.')});
  setTimeout(function(){if(!opened)onFail('Oda bulunamadı. Kodu kontrol et.')},9000);
 });
 peer.on('error',function(e){onFail(e&&e.type==='peer-unavailable'?'Oda bulunamadı. Kodu kontrol et.':'Bağlantı kurulamadı ('+(e&&e.type||'hata')+').')});
 self.send=function(d){if(conn&&conn.open)conn.send({from:me,d:d})};
}

  C.net=new ClientNet(c,me.id,clientMsg,function(){C.net.send({t:'join',name:me.name,av:me.av})},function(err){if(C&&C.st&&C.st.phase==='end')return;APP.className='join';APP.innerHTML='<div class="panel narrow"><h2>😕 Bağlanılamadı</h2><div class="err">'+esc(err)+'</div><p class="muted">Okul ağı bağlantıyı engelliyor olabilir. Öğretmenin tek ekran moduna geçebilir.</p><button class="go" id="rt">Tekrar dene</button></div>';$('rt').onclick=function(){joinScreen(c)}});
 };
}
function clientMsg(s){
 if(s.t==='err'){APP.innerHTML='<div class="panel narrow"><div class="err">'+esc(s.m)+'</div></div>';return}
 if(s.t!=='st')return;
 var prev=C.st;C.st=s;
 var head='<div class="chead"><span>'+s.av+' <b>'+esc(s.name)+'</b></span><span>'+s.score+' puan</span></div>';
 APP.className='client';
 if(s.phase==='lobby'||s.phase==='tekLobby'){APP.innerHTML=head+'<div class="cwait"><div class="big-ic">✅</div><h2>Katıldın!</h2><p>Öğretmen yarışmayı başlatınca sorular burada görünecek.</p><p class="muted">'+esc(s.lvl)+'</p></div>';return}
 if(s.phase==='q'){
  if(s.answered){APP.innerHTML=head+'<div class="cwait"><div class="big-ic">'+SHAPES[s.my]+'</div><h2>Cevabın alındı!</h2><p>Diğer takımlar bekleniyor…</p></div>';return}
  APP.innerHTML=head+'<div class="cq"><small>Soru '+(s.qi+1)+' / '+s.n+'</small><h3>'+esc(s.q)+'</h3><div class="tbar"><i id="ctb"></i></div></div><div class="cops">'+s.o.map(function(o,i){return '<button class="cop '+COLS[i]+'" data-a="'+i+'"><span class="sh">'+SHAPES[i]+'</span>'+esc(o)+'</button>'}).join('')+'</div>';
  qa('.cop').forEach(function(b){b.onclick=function(){if(navigator.vibrate)navigator.vibrate(30);C.net.send({t:'ans',qi:s.qi,a:+b.dataset.a});qa('.cop').forEach(function(x){x.disabled=true;x.classList.toggle('pick',x===b)})}});
  var tot=Math.max(1,s.deadline-Date.now());
  clearInterval(TIMER);TIMER=setInterval(function(){var el=$('ctb');if(!el)return clearInterval(TIMER);el.style.width=Math.max(0,(s.deadline-Date.now())/tot*100)+'%'},200);
  return;
 }
 if(s.phase==='rev'){
  var ok=s.my===s.c;if(prev&&prev.phase!=='rev')(ok?SFX.good:SFX.bad)();
  APP.innerHTML=head+'<div class="cres '+(s.my==null?'none':ok?'ok':'no')+'"><div class="big-ic">'+(s.my==null?'⏰':ok?'🎉':'😕')+'</div><h2>'+(s.my==null?'Süre doldu':ok?'Doğru!':'Yanlış')+'</h2>'+(ok?'<div class="gain">+'+s.gain+'</div>':'')+'<p><b>Doğru cevap:</b> '+SHAPES[s.c]+' '+esc(s.o[s.c])+'</p><p class="ex">'+esc(s.e)+'</p><p class="muted">Sıran: '+s.rank+' / '+s.of+'</p></div>';
  return;
 }
 if(s.phase==='board'){APP.innerHTML=head+'<div class="cwait"><div class="big-ic">🏆</div><h2>'+s.rank+'. sıradasın</h2><p>'+s.score+' puan · '+s.of+' takım</p><p class="muted">Tahtaya bak!</p></div>';return}
 if(s.phase==='end'){
  APP.innerHTML=head+'<div class="cwait"><div class="big-ic">'+(s.rank===1?'🥇':s.rank===2?'🥈':s.rank===3?'🥉':'🏁')+'</div><h2>Yarışma bitti!</h2><p><b>'+s.rank+'.</b> oldunuz · '+s.score+' puan</p><button class="go" id="myc">🎓 Sertifikamı göster</button></div>';
  $('myc').onclick=function(){printCerts([{name:s.name,av:s.av,score:s.score,rank:s.rank,of:s.of}],s.lvl,s.teacher)};
 }
}

/* =============== EDİTÖR =============== */
var KINDS={sms:'💬 SMS',wa:'🟢 WhatsApp',dm:'📸 Sosyal medya mesajı',mail:'📧 E-posta',web:'🌐 Web sitesi',call:'📞 Telefon araması',durum:'📌 Durum'};
function editor(si){
 stopAll();
 var S=sets();
 if(si==null){
  APP.className='setup';
  APP.innerHTML='<div class="panel"><button class="back" id="bk">← Ana menü</button><h2>✏️ Kendi sorularını yaz</h2><p class="muted">Kendi senaryolarını yaz; yarışma kurarken “Kendi setin” olarak seçebilirsin. Öğrenciler de yazabilir: dolandırıcının gözünden düşünmek tuzakları fark etmeyi öğretir!</p>'+
  '<div class="setl">'+(S.length?S.map(function(s,i){return '<div class="setr"><b>'+esc(s.name)+'</b><span class="muted">'+s.qs.length+' soru</span><button class="sm" data-e="'+i+'">Düzenle</button><button class="sm" data-x="'+i+'">Paylaş</button><button class="sm danger" data-d="'+i+'">Sil</button></div>'}).join(''):'<p class="muted">Henüz bir setin yok.</p>')+'</div>'+
  '<div class="row2"><button class="go" id="ns">+ Yeni set</button><button class="sm" id="imp">📥 Paylaşım kodu ile içe aktar</button></div><div id="impbox"></div></div>';
  $('bk').onclick=home;
  $('ns').onclick=function(){S.push({name:'Yeni set '+(S.length+1),qs:[]});ls('sa-sets',S);editor(S.length-1)};
  qa('[data-e]').forEach(function(b){b.onclick=function(){editor(+b.dataset.e)}});
  qa('[data-d]').forEach(function(b){b.onclick=function(){var i=+b.dataset.d;if(b.dataset.sure){S.splice(i,1);ls('sa-sets',S);editor()}else{b.dataset.sure=1;b.textContent='Emin misin?'}}});
  qa('[data-x]').forEach(function(b){b.onclick=function(){var code=btoa(unescape(encodeURIComponent(JSON.stringify(S[+b.dataset.x]))));$('impbox').innerHTML='<div class="lbl">Paylaşım kodu (kopyalayıp başka bilgisayarda içe aktar)</div><textarea class="inp" rows="4" readonly>'+esc(code)+'</textarea>';$('impbox').querySelector('textarea').select()}});
  $('imp').onclick=function(){$('impbox').innerHTML='<div class="lbl">Paylaşım kodunu yapıştır</div><textarea class="inp" rows="4" id="ic"></textarea><button class="sm" id="icg">İçe aktar</button><div id="icm"></div>';$('icg').onclick=function(){try{var o=JSON.parse(decodeURIComponent(escape(atob($('ic').value.trim()))));if(!o||!Array.isArray(o.qs))throw 0;S.push({name:String(o.name||'İçe aktarılan set').slice(0,40),qs:o.qs.filter(validQ)});ls('sa-sets',S);editor()}catch(e){$('icm').innerHTML='<div class="err">Kod okunamadı.</div>'}}};
  return;
 }
 var set=S[si];
 APP.className='setup';
 APP.innerHTML='<div class="panel wide"><button class="back" id="bk">← Setlerim</button><div class="lbl">Set adı</div><input id="sn" class="inp" maxlength="40" value="'+esc(set.name)+'">'+
 '<div class="edgrid"><div class="edform"><h3 id="fh">Yeni soru</h3>'+
 '<div class="lbl">Kart türü</div><select id="fk" class="inp">'+Object.keys(KINDS).map(function(k){return '<option value="'+k+'">'+KINDS[k]+'</option>'}).join('')+'</select>'+
 '<div class="lbl">Gönderen / başlık</div><input id="ff" class="inp" maxlength="60" placeholder="Örn. KARGO, @hediye_dunyasi, Banka">'+
 '<div class="lbl">Adres / numara <small class="muted">(e-posta ve web için)</small></div><input id="fa" class="inp" maxlength="80" placeholder="Örn. destek@banka-guvenlik.com, http://...">'+
 '<div class="lbl">Mesaj <small class="muted">(**kalın** yazabilirsin)</small></div><textarea id="fm" class="inp" rows="3" maxlength="300"></textarea>'+
 '<div class="lbl">Bağlantı <small class="muted">(isteğe bağlı)</small></div><input id="fu" class="inp" maxlength="80" placeholder="Örn. kargo-takip.info">'+
 '<div class="lbl">Soru</div><input id="fq" class="inp" maxlength="120" placeholder="Örn. Bu mesaja ne yaparsın?">'+
 '<div class="lbl">Seçenekler <small class="muted">(doğru olanı işaretle; en az 2)</small></div>'+[0,1,2,3].map(function(i){return '<div class="oprow"><span class="sh '+COLS[i]+'">'+SHAPES[i]+'</span><input id="fo'+i+'" class="inp" maxlength="90"><label><input type="radio" name="fc" value="'+i+'"'+(i===0?' checked':'')+'> doğru</label></div>'}).join('')+
 '<div class="lbl">Açıklama <small class="muted">(cevaptan sonra gösterilir)</small></div><textarea id="fe" class="inp" rows="2" maxlength="250"></textarea><div id="fmg"></div><div class="row2"><button class="go sm" id="fs">Soruyu kaydet</button><button class="sm" id="fclr">Temizle</button></div></div>'+
 '<div class="edprev"><div class="lbl">Önizleme</div><div id="pv" class="qcard"></div><div class="lbl" style="margin-top:14px">Sorular ('+set.qs.length+')</div><div class="qlist">'+(set.qs.length?set.qs.map(function(q,i){return '<div class="ql"><span>'+(i+1)+'. '+esc(q.q)+'</span><button class="sm" data-qe="'+i+'">Düzenle</button><button class="sm danger" data-qd="'+i+'">Sil</button></div>'}).join(''):'<p class="muted">Henüz soru yok.</p>')+'</div></div></div></div>';
 var edit=null;
 $('bk').onclick=function(){set.name=$('sn').value.trim()||set.name;ls('sa-sets',S);editor()};
 $('sn').onchange=function(){set.name=this.value.trim()||set.name;ls('sa-sets',S)};
 function read(){var o=[0,1,2,3].map(function(i){return $('fo'+i).value.trim()});var c=+(document.querySelector('input[name=fc]:checked')||{value:0}).value;var keep=o.map(function(x,i){return x?i:-1}).filter(function(i){return i>=0});
  return {k:$('fk').value,f:$('ff').value.trim(),a:$('fa').value.trim(),m:$('fm').value.trim(),u:$('fu').value.trim(),q:$('fq').value.trim(),o:keep.map(function(i){return o[i]}),c:keep.indexOf(c),e:$('fe').value.trim()}}
 function prev(){$('pv').innerHTML=card(read())}
 qa('#fk,#ff,#fa,#fm,#fu').forEach(function(x){x.oninput=prev;x.onchange=prev});prev();
 function fill(q){$('fk').value=q.k;$('ff').value=q.f||'';$('fa').value=q.a||'';$('fm').value=q.m||'';$('fu').value=q.u||'';$('fq').value=q.q||'';[0,1,2,3].forEach(function(i){$('fo'+i).value=q.o[i]||''});qa('input[name=fc]').forEach(function(r){r.checked=+r.value===q.c});$('fe').value=q.e||'';prev()}
 $('fclr').onclick=function(){edit=null;$('fh').textContent='Yeni soru';fill({k:'sms',o:[],c:0})};
 $('fs').onclick=function(){var q=read();
  if(!q.m||!q.q){$('fmg').innerHTML='<div class="err">Mesaj ve soru boş olamaz.</div>';return}
  if(q.o.length<2){$('fmg').innerHTML='<div class="err">En az iki seçenek yaz.</div>';return}
  if(q.c<0){$('fmg').innerHTML='<div class="err">Doğru olarak işaretlediğin seçenek boş.</div>';return}
  if(edit!=null)set.qs[edit]=q;else set.qs.push(q);set.name=$('sn').value.trim()||set.name;ls('sa-sets',S);editor(si)};
 qa('[data-qe]').forEach(function(b){b.onclick=function(){edit=+b.dataset.qe;$('fh').textContent=(edit+1)+'. soruyu düzenle';fill(set.qs[edit])}});
 qa('[data-qd]').forEach(function(b){b.onclick=function(){set.qs.splice(+b.dataset.qd,1);ls('sa-sets',S);editor(si)}});
}
function validQ(q){return q&&typeof q.q==='string'&&Array.isArray(q.o)&&q.o.length>=2&&q.c>=0&&q.c<q.o.length&&KINDS[q.k]}

/* =============== KONFETİ =============== */
function confetti(){
 var cv=document.createElement('canvas');cv.className='conf';document.body.appendChild(cv);var x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 var C2=['#ff4d6d','#ffd23f','#3ddc97','#4d9de0','#b388ff','#fff'],P=[];for(var i=0;i<200;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:-2+Math.random()*4,vy:2+Math.random()*4,r:4+Math.random()*7,a:Math.random()*6,c:C2[i%C2.length]});
 var t0=Date.now();(function f(){var t=Date.now()-t0;x.clearRect(0,0,cv.width,cv.height);P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.a+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(t<5000)requestAnimationFrame(f);else cv.remove()})();
}

window.addEventListener('beforeunload',function(e){if(H&&H.phase&&H.phase!=='end'&&H.phase!=='lobby'&&H.qi>=0){e.preventDefault();e.returnValue=''}});
home();
})();
